name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cache Electron downloads
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-electron-

      - name: Install dependencies
        run: npm ci

      - name: Sync version with tag
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}' -replace '^v', ''
          Write-Host "Setting package version to $version"
          npm version $version --no-git-tag-version --allow-same-version

      # Cross-builds arm64 from the x64 runner. Safe here because the app has
      # no native (node-gyp) dependencies -- only the Electron binary differs.
      # Each arch is built in its own invocation: passing both at once makes
      # electron-builder additionally emit a ~2x-size combined-arch installer.
      - name: Build x64 + arm64
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $publish = if ('${{ github.ref_type }}' -eq 'tag') { 'always' } else { 'never' }
          npx electron-builder --win --x64 --publish $publish
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx electron-builder --win --arm64 --publish $publish
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest*.yml
          if-no-files-found: error
          retention-days: 14
