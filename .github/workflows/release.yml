name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cache Electron downloads
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-electron-

      - name: Install dependencies
        run: npm ci

      - name: Sync version with tag
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}' -replace '^v', ''
          Write-Host "Setting package version to $version"
          npm version $version --no-git-tag-version --allow-same-version

      # x64 only. Windows on ARM runs x64 binaries under emulation, and the app
      # has no native (node-gyp) dependencies, so a native arm64 build buys
      # nothing. It also did not work: the arm64 NSIS installer shipped a
      # complete app-arm64.7z payload but extracted only the uninstaller on ARM
      # hardware -- its architecture check selected a package name that a
      # single-arch installer does not contain.
      - name: Build
        shell: pwsh
        run: npx electron-builder --win --x64 --publish never

      # Publishing is deliberately separate from building. electron-builder's
      # own publisher creates a draft per invocation and cannot find an existing
      # draft by tag (the GitHub API omits drafts from get-release-by-tag), so
      # publishing from the build step produced duplicate drafts for one tag.
      - name: Publish draft release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $files = Get-ChildItem dist/*.exe | ForEach-Object { $_.FullName }
          if (-not $files) { throw 'no installer found in dist/' }
          gh release create '${{ github.ref_name }}' $files --draft --title '${{ github.ref_name }}'

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 14
